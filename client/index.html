<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/vite.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Sistema de Votación - Unidad Educativa Simulada</title>
    <script>
      // FORCE LIGHT THEME BY DEFAULT - NO AUTOMATIC DETECTION
      (function() {
        // Apply light theme immediately to prevent flash
        document.documentElement.classList.add('light');
        
        const THEME_KEY = 'sistema-votacion-theme';
        
        // Theme application function
        function applyTheme(theme) {
          document.documentElement.classList.remove('light', 'dark');
          document.documentElement.classList.add(theme);
        }
        
        // Check if user has explicitly selected dark theme
        try {
          const stored = localStorage.getItem(THEME_KEY);
          if (stored === 'dark') {
            applyTheme('dark');
          }
          // If no stored theme or light, stay in light (already applied)
        } catch (e) {
          // Stay in light mode on error
        }
        
        // Global function for theme switching
        window.__setTheme = function(newTheme) {
          if (newTheme === 'dark' || newTheme === 'light') {
            try {
              localStorage.setItem(THEME_KEY, newTheme);
              applyTheme(newTheme);
            } catch (e) {
              console.warn('Theme storage error:', e);
            }
          }
        };
      })()
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
