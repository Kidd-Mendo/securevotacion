<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/vite.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Sistema de Votación - Unidad Educativa Simulada</title>
    <script>
      (function() {
        const THEME_KEY = 'sistema-votacion-theme';
        
        // Simple theme management - just apply what's stored
        function applyTheme(theme) {
          document.documentElement.classList.remove('light', 'dark');
          document.documentElement.classList.add(theme);
          console.log('HTML Script - Applied initial theme:', theme);
        }
        
        // Get stored theme ONLY if user explicitly selected it
        let theme = 'light'; // Always default to light
        try {
          const stored = localStorage.getItem(THEME_KEY);
          if (stored === 'dark') {
            theme = 'dark';
            console.log('HTML Script - User selected dark theme');
          } else {
            console.log('HTML Script - Using default light theme');
          }
        } catch (error) {
          console.warn('HTML Script - Storage read error:', error);
        }
        
        console.log('HTML Script - Initial theme:', theme);
        applyTheme(theme);
        
        // Global function for React to use
        window.__setTheme = function(newTheme) {
          if (newTheme === 'dark' || newTheme === 'light') {
            try {
              localStorage.setItem(THEME_KEY, newTheme);
              applyTheme(newTheme);
              console.log('HTML Script - Theme updated to:', newTheme);
            } catch (error) {
              console.warn('HTML Script - Theme update error:', error);
            }
          }
        };
      })()
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
