<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1" />
    <title>Sistema de Votación - Unidad Educativa Simulada</title>
    <script>
      // Aplicar tema inmediatamente para prevenir flash
      (function() {
        try {
          const storageKey = 'sistema-votacion-theme';
          const savedTheme = localStorage.getItem(storageKey);
          
          console.log('Theme from localStorage:', savedTheme); // Debug
          
          // Aplicar el tema guardado si existe
          if (savedTheme === 'dark') {
            document.documentElement.classList.add('dark');
            document.documentElement.classList.remove('light');
            console.log('Applied dark theme');
          } else {
            // Para cualquier otro caso (light, null, undefined), aplicar light
            document.documentElement.classList.add('light');
            document.documentElement.classList.remove('dark');
            // Solo guardar si no existía antes
            if (!savedTheme) {
              localStorage.setItem(storageKey, 'light');
            }
            console.log('Applied light theme');
          }
        } catch (error) {
          // En caso de error, usar tema claro por defecto
          document.documentElement.classList.add('light');
          document.documentElement.classList.remove('dark');
          console.warn('Error loading theme:', error);
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
    <!-- This is a replit script which adds a banner on the top of the page when opened in development mode outside the replit environment -->
    <script type="text/javascript" src="https://replit.com/public/js/replit-dev-banner.js"></script>
  </body>
</html>
